name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Seed local Maven repository from bundled repo
        run: |
          mkdir -p ~/.m2/repository
          cp -r repo/* ~/.m2/repository/

      - name: Build and Package with Maven
        run: mvn clean package -Dcheckstyle.skip=true -Dsurefire.excludedGroups=benchmark

      - name: Upload Distribution Artifact
        uses: actions/upload-artifact@v4
        with:
          name: youtrackdb-app-dist
          path: |
            target/*.zip
            target/*.tar.gz
            target/*.jar

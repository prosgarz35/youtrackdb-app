# ==============================================================================
# YouTrackDB Database Configuration (Optimized for High-Throughput Mail Server)
# ==============================================================================
# Path to store YouTrackDB embedded databases (relative to basedir or absolute)
youtrackdb.path=var/youtrackdb

# Database name within the embedded environment
youtrackdb.database=james

# ==============================================================================
# Storage & Low SSD Wear Optimization Profile (Strict ACID, Zero Loss)
# All parameters have embedded defaults if omitted or if this file is missing.
# ==============================================================================

# 1. Direct Memory Page Cache Size for DiskStorage in megabytes
youtrackdb.storage.diskCache.bufferSize=2048

# 2. Percentage of disk cache used as write cache for dirty pages (25% = 512 MB)
youtrackdb.storage.diskCache.writeCachePart=25

# 3. Interval between flushing dirty pages from write cache to disk in ms
youtrackdb.storage.diskCache.writeCachePageFlushInterval=25

# 4. Direct memory WAL buffer size in megabytes
youtrackdb.storage.wal.bufferSize=256

# 5. WAL (Write-Ahead-Log) Cache Size in 4K pages (65536 pages = 256 MB)
youtrackdb.storage.wal.cacheSize=65536

# 6. Maximum interval between WAL commits in ms (group commit batching timeout)
youtrackdb.storage.wal.commitTimeout=25

# 7. Preallocate direct memory buffers to eliminate runtime allocation stalls
youtrackdb.memory.directMemory.preallocate=true

# 8. LRU cache size for parsed YQL queries and execution plans
youtrackdb.statement.cacheSize=2048

# ==============================================================================
# Durability & OS System Call Optimizations
# ==============================================================================
youtrackdb.storage.callFsync=true
youtrackdb.storage.openFiles.limit=4096
youtrackdb.memory.useUnsafe=true

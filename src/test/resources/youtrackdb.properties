# ==============================================================================
# YouTrackDB Database Configuration (Optimized for High-Throughput Mail Server)
# ==============================================================================
# Path to store YouTrackDB embedded databases (relative to basedir or absolute)
youtrackdb.path=var/youtrackdb

# Database name within the embedded environment
youtrackdb.database=james

# ==============================================================================
# Storage & Low SSD Wear Optimization Profile
# ==============================================================================
# Direct Memory Page Cache Size for DiskStorage (in megabytes)
# Keeps indexes and hot record pages resident in direct memory
youtrackdb.storage.diskCache.bufferSize=2048

# Percentage of disk cache used as write cache (15% = ~300 MB write buffer)
youtrackdb.storage.diskCache.writeCachePart=15

# Interval between flushing of pages from write cache in ms (25 ms balances write batching with low flush latency)
youtrackdb.storage.diskCache.writeCachePageFlushInterval=25

# WAL (Write-Ahead-Log) Cache Size in 4K pages (131072 pages = 512 MB)
# Aggregates write operations into large sequential batches in memory
youtrackdb.storage.wal.cacheSize=131072

# Direct memory WAL buffer size in megabytes (128 MB for high throughput group commit)
youtrackdb.storage.wal.bufferSize=128

# True ACID durability: fsync on every transaction commit to prevent data loss on power cut
youtrackdb.storage.callFsync=true

# Amount of cached locks for storage components (reduces GC allocations on concurrent transactions)
youtrackdb.storage.componentsLock.cache=20000

# Open files limit (reduces frequent open/close syscalls during concurrent IMAP/SMTP sessions)
youtrackdb.storage.openFiles.limit=4096

# Direct memory unsafe access for maximum serialization speed
youtrackdb.memory.useUnsafe=true

# ==============================================================================
# YouTrackDB Database Configuration (Optimized for High-Throughput Mail Server)
# ==============================================================================
# Path to store YouTrackDB embedded databases (relative to basedir or absolute)
youtrackdb.path=var/youtrackdb

# Database name within the embedded environment
youtrackdb.database=james

# ==============================================================================
# Storage & Low SSD Wear Optimization Profile
# ==============================================================================
# Direct Memory Page Cache Size for DiskStorage (2 GB)
# Keeps indexes and hot record pages resident in direct memory
youtrackdb.storage.diskCache.bufferSize=2048m

# WAL (Write-Ahead-Log) Cache Size in 4K pages (131072 pages = 512 MB)
# Aggregates write operations into large sequential batches in memory
youtrackdb.storage.wal.cacheSize=131072

# Direct memory WAL buffer size (64 MB)
youtrackdb.storage.wal.bufferSize=64m

# Disable blocking fsync syscall on every transaction commit
# Aggregates sync operations to reduce flash memory wear-leveling exhaustion
youtrackdb.storage.callFsync=false

# Open files limit (reduces frequent open/close syscalls during concurrent IMAP/SMTP sessions)
youtrackdb.storage.openFiles.limit=4096

# Direct memory unsafe access for maximum serialization speed
youtrackdb.memory.useUnsafe=true
